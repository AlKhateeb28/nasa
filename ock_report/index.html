<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Выгрузка ОЦК</title>

    <link rel="icon" href="./ock_report/star.ico"/>

    <link rel="stylesheet" href="./fcc/css/common.css"/>
    <style>
        body {
            font-family: 'Trebuchet MS', Verdana, Tahoma, sans-serif;
            /*background-color: #e4e4e4;*/
            background-color: #212121;
        }

        .loader-view {
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
            width: 24px;
            height: 24px;
            color: whitesmoke;
        }

        /* From Uiverse.io */
        .button {
            cursor: pointer;
            position: relative;
            display: inline-block;
            transform-style: preserve-3d;
            transform: rotateX(-45deg) rotateY(25deg) rotateZ(0deg);
            background-color: transparent;
            border: none;
        }

        .lid {
            position: absolute;
            transform-style: preserve-3d;
            transition: all 1s ease-in-out;
            transform-origin: 0 80px -120px;
            height: 80px;
            width: 250px;
            background-color: rgba(0, 0, 0, 0);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .lid:hover,
        .button:hover .lid {
            transform: translate(-50%, -50%) rotateX(60deg);
        }

        .lid .side {
            display: inline-block;
            width: 250px;
            height: 250px;
            background-color: rgba(63, 112, 141, 0.308);
            position: absolute;
            top: 50%;
            left: 50%;
            border: solid 1px rgba(0, 132, 255, 0.226);
        }
        .front {
            transform: translate(-50%, -50%) translateZ(125px);
            height: 80px !important;
        }
        .top {
            transform: translate(-50%, -50%) rotateX(90deg) translateZ(40px);
            background-color: rgba(167, 47, 10, 0.438);
        }
        .left {
            transform: translate(-50%, -50%) rotateY(90deg) translateZ(125px);
            height: 80px !important;
        }

        .right {
            transform: translate(-50%, -50%) rotateY(-90deg) translateZ(125px);
            height: 80px !important;
        }

        .back {
            transform: translate(-50%, -50%) rotateY(180deg) translateZ(125px);
            background-color: rgba(250, 234, 18, 0.418);
            height: 80px !important;
        }

        .back::before {
            content: "";
            display: inline-block;
            position: absolute;
            width: 20px;
            height: 10px;
            background-color: black;
            bottom: 0;
            left: 10px;
        }

        .back::after {
            content: "";
            display: inline-block;
            position: absolute;
            width: 20px;
            height: 10px;
            background-color: black;
            bottom: 0;
            right: 10px;
        }

        .panels {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(90deg) translateZ(-40px);
        }

        .panel_OCK_1 {
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 250px;
            width: 250px;
            background-color: rgb(166, 255, 0);
            background: repeating-linear-gradient(
                    45deg,
                    rgb(247, 243, 33) 0% 2%,
                    black 2% 4%
            );
            box-shadow: 0px 0px 0px 20px red;
        }

        .panel_OCK_2 {
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 200px;
            width: 200px;
            background-color: rgb(0, 0, 0);
            background: linear-gradient(-135deg, rgb(43, 42, 42), black);
            border: solid 5px rgb(247, 243, 33);
        }

        .panel_OCK_1::after {
            content: "ОЦК";
            margin-top: 2px;
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 290px;
            height: 25px;
            color: white;
            font-weight: bold;
            transform: translate(-50%, -50%) translateY(170px);
            font-size: larger;
            background-color: red;
        }

        .panel_OCK_1::before {
            content: "Выгрузка";
            margin-top: 2px;
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 290px;
            height: 25px;
            color: white;
            font-weight: bold;
            transform: translate(-50%, -50%) rotateZ(90deg) translateY(170px);
            font-size: larger;
            background-color: red;
        }

        .panel_OCK_BNO_1 {
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 250px;
            width: 250px;
            background-color: rgb(166, 255, 0);
            background: repeating-linear-gradient(
                    45deg,
                    rgb(247, 243, 33) 0% 2%,
                    black 2% 4%
            );
            box-shadow: 0px 0px 0px 20px red;
        }

        .panel_OCK_BNO_2 {
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 200px;
            width: 200px;
            background-color: rgb(0, 0, 0);
            background: linear-gradient(-135deg, rgb(43, 42, 42), black);
            border: solid 5px rgb(247, 243, 33);
        }

        .panel_OCK_BNO_1::after {
            content: "ОЦК БНО";
            margin-top: 2px;
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 290px;
            height: 25px;
            color: white;
            font-weight: bold;
            transform: translate(-50%, -50%) translateY(170px);
            font-size: larger;
            background-color: orange;
        }

        .panel_OCK_BNO_1::before {
            content: "Выгрузка";
            margin-top: 2px;
            display: inline-block;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 290px;
            height: 25px;
            color: white;
            font-weight: bold;
            transform: translate(-50%, -50%) rotateZ(90deg) translateY(170px);
            font-size: larger;
            background-color: orange;
        }

        .btn-trigger {
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-trigger-1 {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            background-color: rgb(207, 195, 195);
            box-shadow: -0px 1px 0 rgb(54, 54, 54), -0px 2px 0 rgb(54, 54, 54),
            -1px 3px 0 rgb(54, 54, 54), -1px 4px 0 rgb(54, 54, 54),
            -2px 5px 0 rgb(54, 54, 54), -2px 6px 0 rgb(54, 54, 54),
            -3px 7px 0 rgb(54, 54, 54), -3px 8px 0 rgb(54, 54, 54),
            -4px 9px 0 rgb(54, 54, 54), -4px 10px 0 rgb(54, 54, 54),
            -5px 11px 0 rgb(54, 54, 54), -5px 12px 0 rgb(54, 54, 54),
            -6px 13px 0 rgb(54, 54, 54), -6px 14px 0 rgb(54, 54, 54),
            -7px 15px 0 rgb(54, 54, 54), -7px 16px 0 rgb(54, 54, 54),
            -8px 17px 0 rgb(54, 54, 54), -8px 18px 0 rgb(54, 54, 54),
            -9px 19px 0 rgb(54, 54, 54), -9px 20px 0 rgb(54, 54, 54),
            -10px 21px 0 rgb(54, 54, 54), -10px 22px 0 rgb(54, 54, 54),
            -11px 23px 0 rgb(54, 54, 54), -11px 24px 0 rgb(54, 54, 54),
            -12px 25px 0 rgb(54, 54, 54), -12px 26px 0 rgb(54, 54, 54);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(50px);
        }

        .btn-trigger-2 {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: rgb(241, 17, 17);
            box-shadow: -0px 1px 0 rgb(128, 5, 5), -0px 2px 0 rgb(128, 5, 5),
            -1px 3px 0 rgb(128, 5, 5), -1px 4px 0 rgb(128, 5, 5),
            -2px 5px 0 rgb(128, 5, 5), -2px 6px 0 rgb(128, 5, 5),
            -3px 7px 0 rgb(128, 5, 5), -3px 8px 0 rgb(128, 5, 5),
            -4px 9px 0 rgb(128, 5, 5), -4px 10px 0 rgb(128, 5, 5),
            -5px 11px 0 rgb(128, 5, 5), -5px 12px 0 rgb(128, 5, 5),
            -6px 13px 0 rgb(128, 5, 5), -6px 14px 0 rgb(128, 5, 5),
            -7px 15px 0 rgb(128, 5, 5), -7px 16px 0 rgb(128, 5, 5);
            border-radius: 50%;
            transition: all 0.3s;
            transform: translate(-40%, -70%) translateZ(100px);
        }

        .btn-trigger-2:active {
            transform: translate(-50%, -50%) translateZ(100px);
            box-shadow: none;
        }

        @keyframes rotate {
            100% {
                transform: rotateX(360deg);
            }
        }

        /* PATTERNS */

    </style>

    <script type="text/javascript" src="./scripts/jquery.js"></script>

</head>
