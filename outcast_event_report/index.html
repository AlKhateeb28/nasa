<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Отчет по участникам мероприятий</title>

    <style>
        .position-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        #container {
            width: 100px;
            height: 125px;
            margin: auto auto;
        }

        .loading-title {
            display: block;
            text-align: center;
            font-size: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            padding-bottom: 15px;
            color: #888;
        }

        .loading-circle {
            display: block;
            border-left: 5px solid;
            border-top-left-radius: 100%;
            border-top: 5px solid;
            margin: 5px;
            animation-name: Loader_611;
            animation-duration: 1500ms;
            animation-timing-function: linear;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            animation-fill-mode: forwards;
        }

        .sp1 {
            border-left-color: #002b4e;
            border-top-color: #002b4e;
            width: 40px;
            height: 40px;
        }

        .sp2 {
            border-left-color: #0062a9;
            border-top-color: #0062a9;
            width: 30px;
            height: 30px;
        }

        .sp3 {
            width: 20px;
            height: 20px;
            border-left-color: #e53c65;
            border-top-color: #e53c65;
        }

        @keyframes Loader_611 {
            0% {
                transform: rotate(0deg);
                transform-origin: right bottom;
            }

            25% {
                transform: rotate(90deg);
                transform-origin: right bottom;
            }

            50% {
                transform: rotate(180deg);
                transform-origin: right bottom;
            }

            75% {
                transform: rotate(270deg);
                transform-origin: right bottom;
            }

            100% {
                transform: rotate(360deg);
                transform-origin: right bottom;
            }
        }
    </style>

    <script type="text/javascript" src="./scripts/jquery.js"></script>
    <script type="text/javascript" src="./fcc/js/jsonReviver.js"></script>
    <script type="text/javascript" src="./rck_event_report/index.js"></script>
</head>

<body>


<%
    regionId = OptInt(Request.Query.GetOptProperty("region_id"));
%>
<div id="region" style="display: none"><%=regionId%></div>

<div id="message_box"></div>

<div class="position-center">
    <div id="container">
        <label id="caption" class="loading-title">Формируем файл ...</label>
        <span id="loader" class="loading-circle sp1">
            <span class="loading-circle sp2">
                <span class="loading-circle sp3"></span>
            </span>
        </span>
    </div>
</div>

</div>

<script>
    $(document).ready(function () {
        IndexPage.createReport();
    });
</script>
</body>
</html>
