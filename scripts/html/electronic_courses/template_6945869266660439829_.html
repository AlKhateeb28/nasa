<script>
    var cardTemplate = '' +
        `<div class="col col-12 col-md-4 fcc-page-card">
			<div class="card body-card">
				<div class="circle-container">
					<div class="duration-circle">

				</div>
				<div style="height: 192px; background: url(&quot;@img_url&quot;) center center / cover no-repeat;"></div>
				<div class="card-body">
					<div class="card-title-text">
						<div>
							<h4 class="card-title" >@name</h4>
							<div class="card-text my-3" >@description</div>
						</div>
						<div style="display: inline-flex; align-items: center; margin-bottom: 10px;">
							<img class="mysvg" src="/static/thumbs-up-solid.svg">
							<span class="card-text my-card-text">@likes</span>
							<img class="mysvg" src="/static/star-solid.svg">
							<span class="card-text" >@views</span>
							<span class="card-text" >&#160;&#160;&#160;</span>
							<span class="card-status" style="color: rgb(@status_color);"  >@status</span>
						</div>
					</div>
				</div>
				<div class="link-text" data-name="state" onclick="window.open('view_doc.html?mode=course&doc_id=6674846170380136045&object_id=@id', '_blank');">
					Подробнее
				</div>
			</div>
		</div>`

    var cardTemplate2 = '' +
        `<div class="col col-12 col-md-4 fcc-page-card">
			<div class="card body-card">
				<div class="circle-container">
					<div class="duration-circle">
						<span > @duration мин</span>
					</div>
				</div>
				<div class="isnew-container">
					<div class="isnew-circle2">
						<span > @isnew</span>
					</div>
				</div>
				<div style="height: 192px; background: url(&quot;@img_url&quot;) center center / cover no-repeat;"></div>
				<div class="card-body">
					<div class="card-title-text">
						<div>
							<h4 class="card-title" >@name</h4>
							<div class="card-text my-3" >@description</div>
						</div>
						<div style="display: inline-flex; align-items: center; margin-bottom: 10px;">
							<img class="mysvg" src="/static/thumbs-up-solid.svg">
							<span class="card-text my-card-text">@likes</span>
							<img class="mysvg" src="/static/star-solid.svg">
							<span class="card-text" >@views</span>
							<span class="card-text" >&#160;&#160;&#160;</span>
							<span class="card-status" style="color: rgb(@status_color);"  >@status</span>
						</div>
					</div>
				</div>
				<div class="link-text" data-name="state" onclick="window.open('view_doc.html?mode=course&doc_id=6674846170380136045&object_id=@id', '_blank');">
					Подробнее
				</div>
			</div>
		</div>`
    var preloader = `
		<div class="d-flex justify-content-center">
			<div class="spinner-border" role="status">
			</div>
		</div>
		`

    var ajaxHelperTemplate = "custom_web_template.html?object_id=6945869830255946062";

    var coursesArr = []
    var coursesNames = []

    var search_word = ''
    var filter_status = 'Поиск по статусу'
    var filter_direction = 'Поиск по направлению'
    var filter_position = 'Поиск по должности'
    var flexCheckDefault = false;
    var showSocial = false;

    function get_courses ( _search_word ) {
        $.ajax({
            url: ajaxHelperTemplate,
            async: true,
            cache: false,
            data: {
                action: "get_courses",
                search: _search_word,
                document_id: '6674846170380136045' // Электронные курсы
            },
            type: "POST",
            dataType: "text",
            beforeSend: function() {
                $('[data-id="container"]').empty().append( preloader );
            },
            success: function ( response ) {
                //console.log("Ajax get_courses прошел");
                //console.log( response )
                coursesArr = JSON.parse( response );
                coursesNames = coursesArr.map( _course => _course.name );

                coursesDirectionsAll = coursesArr.map( _course => _course.direction).join( ";" ).split( ";" );
                coursesDirections = []
                coursesDirectionsAll.map( direction => {
                    if ( direction != '' && !coursesDirections.includes( direction ) ) {
                        coursesDirections.push( direction )
                        countArr = coursesArr.filter( _course => _course.direction.indexOf( direction ) != -1 ).length
                        $( "#select_direction_id" ).append("<option value='" + direction + "'>" + direction + " - " + countArr + "</option>");
                        // $( "#select_direction_id" ).append("<option value='" + direction + "'>" + direction + "</option>");
                    }
                });

                coursesPositionsAll = coursesArr.map( _course => _course.position).join( ";" ).split( ";" );
                coursesPositions = []
                coursesPositionsAll.map( position => {
                    if ( position != '' && !coursesPositions.includes( position ) ) {
                        coursesPositions.push( position )
                        countArr = coursesArr.filter( _course => _course.position.indexOf( position ) != -1 ).length
                        $( "#select_position_id" ).append("<option value='" + position + "'>" + position + " - " + countArr + "</option>");
                        // $( "#select_position_id" ).append("<option value='" + position + "'>" + position + "</option>");
                    }
                });

                coursesStatuses = []
                coursesArr.map( _course => {
                    if ( !coursesStatuses.includes( _course.status ) ) {
                        coursesStatuses.push( _course.status )
                        $( "#select_status_id" ).append("<option value='" + _course.status + "'>" + _course.status + "</option>");
                    }
                });
                showCourses ( coursesArr, search_word )
            },
            error: function() {
                console.log("Ajax не прошел")
            }
        })
    }
    function get_directions () {
        $.ajax({
            url: ajaxHelperTemplate,
            async: true,
            cache: false,
            data: {
                action: "get_directions"
            },
            type: "POST",
            dataType: "text",
            success: function ( response ) {
                //console.log("Ajax get_directions прошел");
                //console.log( response );
                jsonObject = JSON.parse( response );
                coursesDirections = jsonObject;
                //console.log( coursesDirections );

                coursesDirections.map( _direction => {
                    countArr = coursesArr.filter( _course => _course.direction.indexOf( _direction.value ) != -1 ).length
                    $( "#select_direction_id" ).append("<option value='" + _direction.value + "'>" + _direction.value + " - " + countArr + "</option>");
                });
            },
            error: function() {
                console.log("Ajax не прошел")
            }
        })
    }

    function filter_courses ( _arr, _search_word, _filter_status, _filter_direction, _filter_position, _isnew, social ) {
        if (_search_word != '') {
            _arr = _arr.filter(elem => (elem.name.toLowerCase().indexOf(_search_word.toLowerCase()) + 1));
        }

        if (_filter_status != 'Поиск по статусу') {
            _arr = _arr.filter(elem => (elem.status == _filter_status));
        }

        if (_filter_direction != 'Поиск по направлению') {
            _arr = _arr.filter(elem => (elem.direction.indexOf(filter_direction) != -1));
        }

        if (_filter_position != 'Поиск по должности') {
            _arr = _arr.filter(elem => (elem.position.indexOf(filter_position) != -1));
        }

        if (_isnew) {
            _arr = _arr.filter(elem => (elem.isnew == "+"));
        }

        if (social) {
            _arr = _arr.filter(elem => (parseInt(elem.is_social) == 1));
        }

        return _arr;
    }

    function showCourses ( _coursesArr, _search_word ) {
        $('[data-id="container"]').empty();
        _coursesArr.map(_course => {
            if ( _course.isnew == "+" ) {
                cardCourse = cardTemplate
                    .replace( '@duration', _course.duration )
                    .replace( '@isnew', "Новый" )
                    .replace( '@img_url', _course.img_url )
                    .replace( '@name', insertMark( _course.name, _search_word ) )
                    .replace( '@description', _course.description )
                    .replace( '@likes', _course.likes )
                    .replace( '@views', _course.views )
                    .replace( '@status_color', _course.status_color )
                    .replace( '@status', _course.status )
                    .replace( '@id', _course.id );
            } else {
                cardCourse = cardTemplate2
                    .replace( '@duration', _course.duration )
                    .replace( '@isnew', "" )
                    .replace( '@img_url', _course.img_url )
                    .replace( '@name', insertMark( _course.name, _search_word ) )
                    .replace( '@description', _course.description )
                    .replace( '@likes', _course.likes )
                    .replace( '@views', _course.views )
                    .replace( '@status_color', _course.status_color )
                    .replace( '@status', _course.status )
                    .replace( '@id', _course.id );
            }

            $('[data-id="container"]').append( cardCourse );
        })
        $( "#span_id" ).empty();
        $( "#span_id" ).append( "Найдено курсов: " + _coursesArr.length );
    }

    function insertMark ( _str, _search_word ) {
        if ( _search_word != undefined ) {
            pos = _str.toLowerCase().indexOf( _search_word.toLowerCase() )
            len = _search_word.length
            return _str.slice( 0, pos ) + '<span style="color:#CD5C5C">' + _str.slice( pos, pos + len ) + '</span>' + _str.slice( pos + len )
        } else {
            return _str
        }
    }


    $( function() {
        get_courses('');
        // get_directions();
        var search_input = document.querySelector('input[id="search_id"]');
        search_input.oninput = function() {
            search_word = this.value.trim()
            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, showSocial ), search_word )
        }
        search_input.addEventListener ('keypress', function(e) {
            if ( e.which === 13 ) {
                e.preventDefault();
                search_word = this.value.trim()
                showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, showSocial ), search_word )
            }
        });

        // $( "#search_id" ).autocomplete({
        // source: coursesNames
        // });

        var select_direction = document.querySelector('select[id="select_direction_id"]');
        select_direction.onchange = function() {
            filter_direction = this.value.trim()
            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, showSocial ), search_word )

        };

        var select_position = document.querySelector('select[id="select_position_id"]');
        select_position.onchange = function() {
            filter_position = this.value.trim()
            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, showSocial ), search_word )

        };

        var select_status = document.querySelector('select[id="select_status_id"]');
        select_status.onchange = function() {
            filter_status = this.value.trim()
            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, showSocial ), search_word )
        };

        var check_box = document.querySelector('input[id="flexCheckDefault"]');
        check_box.onchange = function() {
            document.querySelector('input[id="showSocial"]').checked = false;

            flexCheckDefault = this.checked;

            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, flexCheckDefault, false ), search_word );
        };

        var socialCheckBox = document.querySelector('input[id="showSocial"]');
        socialCheckBox.onchange = function() {
            document.querySelector('input[id="flexCheckDefault"]').checked= false;

            showSocial = this.checked;

            showCourses ( filter_courses( coursesArr, search_word, filter_status, filter_direction, filter_position, false, showSocial ), search_word );
        };
    });
</script>

        cur_user_id = document.getElementById("cur_user_id").value;
        var strLoadingText = 'Подождите, идет создание фильтра';
        $.ajax({
            url: "my_controler.html",
            method: "get",
            data: {
