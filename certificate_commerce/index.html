<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Коммерция</title>

    <link rel="icon" href="./fcc/images/commerce.ico"/>

    <link rel="stylesheet" href="./fcc/css/common.css"/>
    <style>
        body {
            font-family: 'Trebuchet MS', Verdana, Tahoma, sans-serif;
            background-color: #e4e4e4;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(1rem, 3%) 1fr minmax(1rem, 3%);
            grid-template-rows: auto;
        }

        td {
            cursor: pointer;
        }

        tr:nth-child(odd) {
            background-color: #eaeaea;
        }

        tr:nth-child(even) {
            background-color: #ddf3ff;
        }

        .row:hover {
            background-color: #0086cd !important;
            color: mintcream;
        }

        .page-button {
            color: mintcream;
            cursor: pointer;
            padding-right: 1rem !important;
            padding-left: 1rem !important;
            border: 1px solid mintcream !important;
            height: 28px;
            background-image: linear-gradient(-20deg, #0086cd, #3fa4d9 0%, #0086cd 100%);
        }

        .first-page-button {
            border-top-left-radius: 0.375rem;
            border-bottom-left-radius: 0.375rem;
        }

        .last-page-button {
            border-top-right-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
        }

        .selected-button {
            background-image: linear-gradient(-20deg, #0086cd, #3fa4d9 0%, #0086cd 100%);
        }

        .unselected-button {
            background-image: linear-gradient(-20deg, grey, grey 0%, grey 100%);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background-color: white;
            box-shadow: 0 2px 6px 0 rgb(218 218 253 / 65%), 0 2px 6px 0 rgb(159, 89, 1);
            border-bottom: 1px solid var(--color-border) !important;
            z-index: 10000;
            user-select: none;
        }

        input {
            caret-color: #ff6f61;
        }

        .item:not(:last-child) {
            border-inline-end: solid 2px #888888;
        }

        .sort_image {
            width: 16px;
            margin-right: 5px;
            cursor: pointer;
        }

        .loader-view {
            cursor: pointer;
            position: absolute;
            top: 70px;
            left: 20px;
            width: 24px;
            height: 24px;
        }
    </style>

    <script type="text/javascript" src="./scripts/jquery.js"></script>
    <script type="text/javascript" src="./fcc/js/webSocket.js"></script>
    <script type="text/javascript" src="./fcc/js/jsonReviver.js"></script>
    <script type="text/javascript" src="./fcc/js/common_classes.js"></script>
    <script type="text/javascript" src="./fcc/certificate_commerce/index.js"></script>
</head>
<body>

<div style="cursor: pointer; position: absolute; top: 20px; left: 20px;">
    <div id="home" class="float-left" onclick="IndexPage.goHome()">
        <img src="./fcc/images/home.png">
    </div >
</div>

<div id="loader" class="loader loader-view" style="visibility: hidden;"></div>

<div id="grid" class="grid">

</div>

<script type="text/html" id="grid_row_template">
    <div id="left_box"></div>
    <div id="grid_box" style="padding-top: 20px; width: 99%">

    </div>
    <div id="right_box"></div>
</script>

<script type="text/html" id="card_template">
    <div id="card" class="flat-card" style="width: 100%; height: 820px;">
        <div style="padding-top: 20px; margin-right: 12px;">
            <div class="float-right" style="margin-right: 35px;">
                <div class="float-left" style="margin-top: 6px; padding-left: 20px;">Учетная запись МУЦ:</div>
                <div class="float-left dropdown" style="margin-left: 10px; width: 70px;">
                    <select id="type" class="dropdown-select">
                        <option value="0">Да</option>
                        <option value="1">Нет</option>
                    </select>
                </div>
                <div class="float-left" style="margin-top: 4px; margin-left: 10px;" >Найти</div>
                <input id="card_find" type="search" class="float-left input-control" placeholder="" aria-controls="example" style="margin-left: 10px; height: 30px;"/>
                <div class="float-left" style="margin-left: 10px;">
                    <button id="find_button" class="button-control enable-button" onclick="IndexPage.onFind()">
                        <div class="text">Найти</div>
                    </button>
                </div>
            </div>
        </div>
        <div class="scrollbar-control" style="margin-top: 80px; height: 80%; width: 99%;">
            <table id="card_table" border="0" style="width: 100%; padding-left: 20px; padding-right: 20px;"></table>
        </div>
    </div>
    <div id="paging" class="footer" style="background-color: #e0e0e0;">
        <div class="float-right" style="margin-right: 20px;">
            <div id="page_message" class="float-left" style="margin-top: 12px; margin-left: -230px;"></div>
            <div id="page_box" class="float-left" style="margin-top: 6px"></div>
        </div>
    </div>
</script>

<script type="text/html" id="header_row_template">
    <tr class="sticky header-colors">
        <th style="width: 20%; padding-top: 3px; padding-bottom: 3px; font-weight: bold;">
            <div class="float-left">ФИО</div>
            <div class="float-right"><img id="sort_1" src="./fcc/js/images/sort_none.png" class="sort_image" data-sort="none" onclick="IndexPage.sortData(this, 0);"/></div>
        </th>
        <th style="font-weight: bold; width: 250px;">
            <div class="float-left">Email</div>
            <div class="float-right"><img id="sort_2" src="./fcc/js/images/sort_none.png" class="sort_image"  data-sort="none" onclick="IndexPage.sortData(this, 1);"/></div>
        </th>
        <th style="text-align: center; width: 250px; font-weight: bold;">
            <div class="float-left">Должность</div>
            <div class="float-right"><img id="sort_3" src="./fcc/js/images/sort_none.png" class="sort_image" data-sort="none" onclick="IndexPage.sortData(this, 2);"/></div>
        </th>
        <th style="text-align: center; width: 95px; font-weight: bold;">
            <div class="float-left">ИНН</div>
            <div class="float-right"><img id="sort_4" src="./fcc/js/images/sort_none.png" class="sort_image" data-sort="none" onclick="IndexPage.sortData(this, 3);"/></div>
        </th>
        <th style="font-weight: bold;">
            <div class="float-left">Организация</div>
            <div class="float-right"><img id="sort_5" src="./fcc/js/images/sort_none.png" class="sort_image" data-sort="none" onclick="IndexPage.sortData(this, 4);"/></div>
        </th>
    </tr>
</script>

<script type="text/html" id="person_row_template">
    <tr id="row" class="row" onclick="IndexPage.goToCommercialCertificates(this)">
        <td id="fio" style="text-indent: 5px; padding-top: 3px; padding-bottom: 3px;"></td>
        <td id="email"></td>
        <td id="position"></td>
        <td id="inn" style="text-align: center"></td>
        <td id="name"></td>
    </tr>
</script>

<script type="text/html" id="page_button_template">
    <button id="page_button" class="float-left page-button"></button>
</script>

<script>
    $(document).ready(function () {
        IndexPage.initialize();

        $("#card_find").focus()
    });
</script>

</body>
</html>
