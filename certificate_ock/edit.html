<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Сертификат</title>

    <link rel="icon" href="./fcc/certificate_ock/ock.ico"/>

    <link rel="stylesheet" href="./fcc/css/common.css"/>

    <style>
        body {
            font-family: 'Trebuchet MS', Verdana, Tahoma, sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(14rem, 15%) 1fr minmax(14rem, 15%);
            grid-template-rows: auto;
        }

        .calendar {
            position: absolute;
            z-index: 1000;
            top: 35%;
            left: 51%;
            transform: translate(-50%, -50%);
        }

        .message {
            border-radius: 3px;
            border: 1px solid dimgrey;
        }

        .success-response {
            background-color: #78fcaf;
        }

        .error-response {
            background-color: #ff9494;
        }
    </style>

    <script type="text/javascript" src="./scripts/jquery.js"></script>
    <script type="text/javascript" src="./fcc/js/jquery.mask.js"></script>
    <script type="text/javascript" src="./fcc/js/moment.js"></script>
    <script type="text/javascript" src="./fcc/js/jsonReviver.js"></script>
    <script type="text/javascript" src="./fcc/js/common_classes.js"></script>
    <script type="text/javascript" src="./fcc/js/calendar.js"></script>
    <script type="text/javascript" src="./fcc/certificate_ock/edit.js"></script>

</head>
<body style="background-color: #e4e4e4;">
<div class="grid">
    <div></div>
    <div onclick="if(Calendar.isActive) Calendar.hide()">
        <div id="card" class="card position-center" style="top: 35%; height: 575px;">
            <div style="margin-top: 4%; margin-left: 7%;">
                <div>
                    <%
                        personId = OptInt(Request.Query.GetOptProperty("person_id"));
                    %>
                    <div id="person" data-id="<%=personId%>" сlass="float-left" style="margin-top: 5px; padding-left: 20px; font-weight: 600;"></div>
                </div>

                <div style="padding-top: 30px;">
                    <div id="organization" class="float-left" style="margin-top: 5px; padding-left: 20px; width: 80%; min-height: 85px; height: 85px;"></div>
                </div>

                <div style="padding-top: 90px;">
                    <div class="float-left" style="margin-top: 5px; padding-left: 20px;">Программа:</div>
                    <div class="float-left dropdown" style="margin-left: 10px; width: 78%;">
                        <select id="program" class="dropdown-select" onchange="EditPage.onProgramChange()">
                            <optgroup id="main_group" label="Сертификация тренера">
                            </optgroup>
                            <optgroup id="rp_group" label="Сертификация руководителя проекта">
                            </optgroup>
                            <optgroup id="additional_group" label="Сертификация аналитика-методолога">
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div style="padding-top: 60px;">
                    <div class="float-left" style="margin-top: 5px; padding-left: 20px;">Результат сертификации:</div>
                    <div class="float-left dropdown" style="margin-left: 10px; width: 30%;">
                        <select id="result" class="dropdown-select" onchange="EditPage.onResultChange()">
                            <option value="Сертифицировать">Сертифицировать</option>
                            <option value="Не сертифицировать">Не сертифицировать</option>
                            <option value="Не выбран">Не выбран</option>
                        </select>
                    </div>
                </div>

                <div style="padding-top: 60px;">
                    <div class="float-left" style="margin-top: 5px; margin-left: 21px;">Дата сертификации: </div>
                    <div class="float-left" style="margin-left: 48px; width: 7%;">
                        <input id="certificate_date" type="text" class="input-control" size="6" onfocusout="EditPage.validateCertificateDate(this)"/>
                    </div>
                    <div class="float-left" style="margin-left: 71px;">
                        <button id="certificate_button" class="button-control enable-button" onclick="event.stopPropagation(); showCalendar('certificate_date')">
                            <div class="text">...</div>
                        </button>
                    </div>
                </div>

                <div style="padding-top: 60px;">
                    <div class="float-left" style="margin-top: 5px; padding-left: 24px;">Серия: </div>
                    <div class="float-left dropdown" style="margin-left: 47px; width: 10%;">
                        <input id="serial" type="text" class="input-control" size="4" disabled="disabled"/>
                    </div>
                </div>

                <div style="padding-top: 60px; visibility: visible;">
                    <div class="float-left" style="margin-top: 5px; padding-left: 24px;">Отправить уведомление:</div>
                    <div class="float-left" style="margin-left: 11px;">
                        <label class="checkbox-ios">
                            <input id="notification" type="checkbox" style="margin-top: 5px; margin-left: 10px;"/>
                            <span class="checkbox-ios-switch"></span>
                        </label>
                    </div>
                </div>

                <div style="padding-top: 52px; padding-right: 30px;">
                    <div id="message_box"class="float-left" style="width: 60%; height: 24px; display: none;">
                        <div id="message" class="message" style="padding-top: 5px; padding-bottom: 5px; padding-left: 10px; box-shadow:  21px 21px 42px #bebebe, -21px -21px 42px #ffffff;"></div>
                    </div>
                    <div class="float-right">
                        <div class="float-left" style="margin-right: 10px;">
                            <button id="save_button" class="button-control enable-button" onclick="EditPage.save()">
                                <div class="text">Сохранить</div>
                            </button>
                        </div>
                        <div class="float-left">
                            <button id="delete_button" class="button-control enable-button" onclick="EditPage.delete()">
                                <div class="text">Удалить</div>
                            </button>
                        </div>
                    </div>
                </div>
                <div style="padding-top: 52px; padding-right: 30px;">
                    <div class="float-right">
                        <div class="float-left" style="padding-right: 10px;">
                            <button id="print_pdf_button" class="button-control enable-button" onclick="EditPage.onPdf()">
                                <div class="text">Распечатать PDF</div>
                            </button>
                        </div>
                        <div class="float-left">
                            <button id="print_all_pdf_button" class="button-control enable-button" onclick="EditPage.onAllPdf()">
                                <div class="text">Распечатать все PDF</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="calendar_element" class="calendar">

    </div>
    <div></div>
</div>

<script type="text/html" id="option_element_template">
    <option id="option" value="#"></option>
</script>

<script>
    function showCalendar(elementId) {
        Calendar.afterSelectAction = elementId;
        Calendar.show();
    }

    $(document).ready(function () {
        $("#certificate_date").mask("99.99.9999");

        $("#calendar_element").html(Calendar.getContent());
        Calendar.initialize();
        Calendar.hide();

        EditPage.getJson("obp");
    });
</script>

</body>
</html>
