<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network</title>

    <link rel="icon" href="images/favicon.ico"/>
    <link href="../kendo/styles/kendo.common.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/index.css"/>

    <script type="text/javascript" src="js/jquery3.js"></script>
    <script type="text/javascript" src="../kendo/js/kendo.all.min.js"></script>
    <script type="text/javascript" src="js/webSocket.js"></script>
    <script type="text/javascript" src="js/jsonReviver.js"></script>
    <script type="text/javascript" src="js/network.js"></script>
</head>
<body style="font-family: 'Noto Sans', sans-serif !important; background-color: black;">

    <div class="tab-element">
        <table style="width: 100%;">
            <tr>
                <td>
                    <div style="padding-left: 16px; float: left;">
                        <button id="all_observe" type="button" observe="true" class="tools-box">All don't observe</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div id="testTabstrip" class="server-element thread-inactive">
                        <ul>
                            <li class="k-state-active server-tab">
                                Test server (10.176.10.36)
                            </li>
                        </ul>
                        <div style="border-width: 0px;">
                            <div id="testServer">
                                <table id="testServer_tbl"></table>
                            </div>
                        </div>
                    </div>
                    <div id="prodTabstrip" class="server-element thread-active">
                        <ul>
                            <li class="k-state-active server-tab">
                                Production server (192.168.0.96)
                            </li>
                        </ul>
                        <div style="border-width: 0px;">
                            <div id="prodServer">
                                <table id="prodServer_tbl"></table>
                            </div>
                        </div>
                    </div>
                    <div id="prodTabstrip97" class="server-element thread-active">
                        <ul>
                            <li class="k-state-active server-tab">
                                Production server (192.168.0.97)
                            </li>
                        </ul>
                        <div style="border-width: 0px;">
                            <div id="prodServer97">
                                <table id="prodServer97_tbl"></table>
                            </div>
                        </div>
                    </div>

                    <div id="postTabstrip" class="server-element thread-inactive">
                        <ul>
                            <li class="k-state-active server-tab">
                                Samoware server (10.176.10.119)
                            </li>
                        </ul>
                        <div style="border-width: 0px;">
                            <div id="postServer">
                                <table id="postServer_tbl"></table>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

<div id="dialog"></div>

<script type="text/x-kendo-template" id="progress-template">
    <div id="progress_block" class="progress-div">

    </div>
</script>

<script type="text/x-kendo-template" id="history_template">
    <div class="server-vertical-block">
        <div id="history_empty_el" class="history-duration-element">

        </div>
        <div id="history_el" class="history-duration-element">

        </div>
    </div>
</script>

<script type="text/x-kendo-template" id="server_template">
    <tr style="cursor: pointer;">
        <td>
            <div class="server-duration">
                <div id="tmp" class="server-name" onclick="showWindow();">
                </div>
                <div class="server-tools">
                    <button id="tmp_observe" observe="true" class="tools-box">Stop observe</button>
                </div>
            </div>
            <div id="tmp_progress" class="server-duration ping-block" onclick="showWindow()">
                <div id="tmp_ping" class="ping-block-text">0 ms</div>
                <div id="tmp_prev_ping" class="ping-block-text ping-prev-block-text">0 ms</div>
            </div>
            <div id="tmp_history" count="0" class="server-vertical-block history-block" style="min-width: 55px;" onclick="showWindow()"></div>
            <div class="server-duration server-info-block" onclick="showWindow();">
                <div>
                    <div id="tmp_time" count="0" step="0">
                    </div>
                    <div>
                        <br/>
                        <div class="server-duration server_min_max">Min:</div>
                        <div id="tmp_ping_min" class="server-duration server_min_max">9999 ms</div>
                        <div class="server-duration server_min_max">Max:</div>
                        <div id="tmp_ping_max" class="server-duration server_min_max">0 ms </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>
</script>

<script type="text/x-kendo-template" id="time_template">
    <div id="tmp_time_element" class="time-box"></div>
</script>

</body>
</html>
