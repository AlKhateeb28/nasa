<script>

    /* ************************************** PROGRESS PLAGIN ****************************************** */

    (function (w, f) { f (jQuery) } 
        (window, function ($)
        {
        if (!$)
        {
            throw new Error('jquery is must be imported')
        }
        function Wload(options)
        {
            this.defaultOpt = {
            text: '',
            time: '',
            el: ''
            }
            this.opt = $.extend({}, this.defaultOpt, options)
        }
        Wload.prototype.hide = function (obj)
        {
            if (obj.time)
            {
            var _this = this
            setTimeout(function ()
            {
                $(_this.opt.el).find('.w_load_body').remove()
                $(_this.opt.el).removeClass('w_load_body_parent')
            }, obj.time)
            } else
            {
            $(this.opt.el).find('.w_load_body').remove()
            $(this.opt.el).removeClass('w_load_body_parent')
            }
        }
        Wload.prototype.bindEvent = function () { }
        Wload.prototype.creatDom = function ()
        {
            var dom = $(this.opt.el)
            var div = $('<div class="w_load_body"></div>')
            div.append('<div class="w_load_content"><span class="w_load_icon"></span><span class="w_load_content_text">' + this.opt.text || '' + '</span></div>')
            dom.addClass('w_load_body_parent').append(div)
            var con = dom.find('.w_load_content')
            con.css({
            'margin-left': -con.outerWidth() / 2,
            'margin-top': -con.outerHeight() / 2
            })
        }
        $.fn.Wload = function (options, other)
        {
            var dom = $(this)
            var opt = options
            if (typeof opt == 'object')
            {
            opt = opt.el ? opt : $.extend({}, opt, { el: dom })
            } else
            {
            if (typeof other == 'object')
            {
                opt = $.extend({}, { el: dom }, other)
            } else
            {
                opt = { el: dom }
            }
            }

            var W = new Wload(opt)
            if (options == 'hide')
            {
            W['hide'](other)
            return
            }
            W.creatDom()
        }
    }))

    objParams = {
        loop: true,
        margin: 0,
        nav: true,
        dots: false,
        autoplay: true,
        autoplayTimeout: 5000,
        autoplayHoverPause: true,
        responsive: {0: {items: 1}, 600: {items: 2}, 1000: { items: 4 } }
    }

    $(document).ready(function() {

        /* ************************************** BLOCK BOOK WEEK ****************************************** */

        var iBookWeek = "<%=tools_web.get_web_param(curParams, 'iBookWeek', '0', true)%>",
            sModeFindBooks = "<%=tools_web.get_web_param(curParams, 'sModeFindBooks', '0', true)%>";

        (function rcvBlockBookWeek () {

            $.ajax({
                type: "POST",
                url: "book_shelves/rmt_actn_main_page_library_FCK.html",
                data: "id_book_week=" + iBookWeek + "&name_block=block-book-week" + "&code_page_lbr_mtrl=" + "<%=tools_web.get_web_param(curParams, 'iTmpltLibraryMaterial', 0, true)%>" + "&id_mark_img=" + "<%=tools_web.get_web_param(curParams, 'iMarkImg', 0, true)%>",
                dataType: "text",
                error: function() {
                    alert('Ошибка загрузки страницы');
                },
                success: function(data) {
                    $('#block-book-week').append(data);
                }
            }); 

        })();
                    

        /* ************************************** BLOCK SEARCH ****************************************** */

        var iChoiceTema = "",
            iChoiceName = "",
            sTextSearch = "";

        (function rcvBlockSearchTema () {

            $.ajax({
                type: "POST",
                url: "book_shelves/rmt_actn_main_page_library_FCK.html",
                data: "id_choice_tema=" + iChoiceTema + "&code_page_lbr_mtrl=" + "<%=tools_web.get_web_param(curParams, 'iTmpltLibraryMaterial', 0, true)%>" + "&name_block=block-book-search-tema",
                dataType: "text",
                error: function() {
                    alert('Ошибка загрузки страницы');
                },
                success: function(data) {
                    //$('#block-book-search-tema').empty();
                    $('#block-book-search-tema').append(data);
                }
            }); 

        })();

        $("#block-book-search-tema").change(function() { 
            iChoiceTema = $(this).children("option:selected").val(); 
            //console.log('iChoiceTema: ' + iChoiceTema)
        });

        /* ************************************** BLOCK RESULT SEARCH ****************************************** */

        function sendDate() {

            $('body').Wload({
                text: ' Загрузка'
            });

            $.ajax({
                type: "POST",
                url: "book_shelves/rmt_actn_main_page_library_FCK.html", 
                data: "id_choice_tema=" + iChoiceTema + "&mode_find_books=" + sModeFindBooks + "&cur_user=" + <%=curUserID%> + "&id_choice_name=" + iChoiceName + "&text_search=" + sTextSearch + "&name_block=block-result-search" + "&code_page_shelve=" + "<%=tools_web.get_web_param(curParams, 'iTmpltShelvePage', 0, true)%>" + "&code_page_lbr_mtrl=" + "<%=tools_web.get_web_param(curParams, 'iTmpltLibraryMaterial', 0, true)%>",
                dataType: "text",
                error: function() {
                    alert('ERROR');
                },
                success: function(data) {
                    $('body').Wload('hide', {});
                    $('#block-result-search').empty();
                    $('#block-result-search').append(data);
                    $('.owl-one').owlCarousel(objParams);
                }
            }); 

        }

        function submitSearch(event) {
            event.preventDefault();
            sTextSearch = $('#block-book-text-search').val().toLowerCase();
            sendDate();
        }

        $('#formSearch').on('submit', submitSearch);


        /* ************************************** MAIN BLOCK ****************************************** */

        (function getMainContent() {

            $('body').Wload({
                text: ' Загрузка'
            });

            $.ajax({
                type: "POST",
                url: "book_shelves/rmt_actn_main_page_library_FCK.html",
                data: "name_block=main-content" + "&cur_user=" + <%=curUserID%> + "&code_page_shelve=" + "<%=tools_web.get_web_param(curParams, 'iTmpltShelvePage', 0, true)%>" + "&code_page_lbr_mtrl=" + "<%=tools_web.get_web_param(curParams, 'iTmpltLibraryMaterial', 0, true)%>",
                dataType: "text",
                error: function() {
                    alert('ERROR');
                },
                success: function(data) {
                    $('body').Wload('hide', {});
                    $('#main-content').empty();
                    $('#main-content').append(data);
