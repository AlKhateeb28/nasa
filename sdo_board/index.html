<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SDO Board</title>

    <link rel="icon" href="./images/favicon.ico" />

    <link rel="stylesheet" href="./css/index.css" />

    <script type="text/javascript" src="./js/jquery3.js"></script>
    <script type="text/javascript" src="./js/jquery-ui.js"></script>
    <script type="text/javascript" src="./js/jquery.modal.min.js"></script>
    <script type="text/javascript" src="./js/moment.js"></script>
    <script type="text/javascript" src="./js/webSocket.js"></script>
    <script type="text/javascript" src="./js/jsonReviver.js"></script>
    <script type="text/javascript" src="./js/apexcharts.min.js"></script>
    <script type="text/javascript" src="./js/ModalWindow.js"></script>
    <script type="text/javascript" src="./js/Dropdown.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
</head>

<body class="body">

    <div id="grid" class="grid">
        <div id="left_box"></div>

        <div id="grid_box">
            <div id="top_block" style="min-height: 580px; margin-top: 5px;">
                <div id="top_left_block" class="float-left" style="min-width: 30%; min-height: 580px;">
                    <div class="box" style="height: 210px; width: 538px;">
                        <div style="font-size: x-large; text-indent: 10px;">Антипрокрастинация цели</div>
                        <div style="margin-left: 172px;">
                            <div
                                style="margin-left: 10px; margin-top: 20px; display: grid; grid-template-columns: 5rem 11rem 3rem;">
                                <div class="course-label">пройдено</div>
                                <div id="courses_completed" class="course-value-info course-left-color">0</div>
                                <div id="increase_count" class="increase-count" style="margin-top: 11px;"
                                    title="Текущее увеличение/уменьшение">0</div>
                            </div>
                            <div style="margin-left: 10px; display: grid; grid-template-columns: 5rem 11rem 6rem;">
                                <div class="float-left course-label">осталось</div>
                                <div id="courses_left" class="float-left course-value-info course-left-color">0</div>
                                <div>
                                    <div id="expected_week" class="increase-count expected-values" style="width: 75px;"
                                        title="Ожидаемая неделя/год выполнения плана"></div>
                                    <div id="expected_start" class="increase-count expected-values"
                                        style="width: 75px; margin-top: 3px;" title="Ожидаемая дата выполнения плана">
                                    </div>
                                    <!--div id="expected_finish" class="increase-count expected-values" style="margin-top: 28px;" title="Или выполнение плана в этот день"></div-->
                                </div>
                            </div>
                            <div style="margin-left: 10px; display: grid; grid-template-columns: 5rem 11rem 6rem;">
                                <div class="float-left course-label">выполнено</div>
                                <div id="courses_done" class="float-left course-value-info course-left-color">0%</div>
                            </div>
                            <div style="margin-left: 10px; display: grid; grid-template-columns: 5rem 11rem 6rem;">
                                <div class="float-left course-label" style="margin-left: -69px;">гадание на подливе
                                </div>
                                <div class="float-left course-value-info course-left-color">
                                    <input id="divine_input" type="text" name="text" class="input"
                                        style="width: 70px; height: 18px;" />
                                </div>
                                <div style="margin-top: 8px;">
                                    <div id="divine_week" class="increase-count expected-values" style="width: 75px;"
                                        title="Ожидаемая неделя/год выполнения плана"></div>
                                    <div id="divine_start" class="increase-count expected-values"
                                        style="width: 75px; margin-top: 3px;" title="Ожидаемая дата выполнения плана">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="box" style="min-height: 158px; width: 538px; margin-top: 20px;">
                        <div style="font-size: x-large; text-indent: 10px;">Прогноз временно́й конвергенции</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr;">
                            <div class="float-left" style="min-height:24px; min-width: 250px;">
                                <div id="courses_expected_time" class="course-value-info course-left-color"
                                    style="margin-top: 38px; font-size: xx-large; text-align: center; margin-left: 10px; width: 290px; cursor: pointer; color: var(--color-course-passed)"
                                    title="Во сколько будет достигнуто вчерашнее количества прохождений"></div>
                            </div>
                            <div class="float-left" style="margin-left: 35px; margin-top: 20px;">
                                <div class="courses_count_grid">
                                    <div>позавчера</div>
                                    <div id="courses_before_yesterday_count"
                                        class="course-value-info course-left-color convergence-value"
                                        style="margin-top: -15px;">0</div>
                                    <div></div>
                                </div>
                                <div class="courses_count_grid">
                                    <div style="margin-top: 16px; margin-left: 39px;">вчера</div>
                                    <div id="courses_yesterday_count"
                                        class="course-value-info course-left-color convergence-value">0</div>
                                    <div id="yesterday_reached_time" class="expected-passed-count"
                                        style="margin-top: 10px;"
                                        title="Во сколько достигнуто позавчерашнее количества прохождений">--:--</div>
                                </div>
                                <div class="courses_count_grid">
                                    <div style="margin-top: 16px; margin-left: 21px;">сегодня</div>
                                    <div id="courses_today_count"
                                        class="course-value-info course-left-color convergence-value">0</div>
                                    <div style="margin-top: -1px;">
                                        <div id="courses_today_leave" class="expected-passed-count"
                                            title="Осталось до вчерашнего количества прохождений">0</div>
                                        <div id="today_reached_time" class="expected-passed-count"
                                            style="margin-top: 2px;"
                                            title="Во сколько достигнуто вчерашнее количества прохождений">--:--</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="top_right_block" class="float-left" style="width: 70%; height: 100%;">
                    <div class="box" style="min-width: 69.76%; min-height: 610px;">
                        <div style="margin-left: 20px; margin-top: 10px;">
                            <div id="chart_wait" style="display: none; height: 32px; position: absolute;">
                                <div class="loader loader-view"></div>
                            </div>
                            <div class="float-left" style="font-size: x-large; margin-left: 60px;">Назначенные и
                                пройденные курсы</div>
                            <div id="refreshed_datetime" class="float-left"
                                style="font-size: x-small; color: burlywood; margin-top: 16px; margin-left: 6px;"></div>
                            <div>
                                <span id="count_box_0" class="expected-passed-count"
                                    style="background-color: #ff9719; display: inline-table; width: 40px; margin-top: 8px;"></span>
                                <span id="count_box_1" class="expected-passed-count"
                                    style="background-color: #ff198c; display: inline-table; width: 40px;"></span>
                                <span id="count_box_4" class="expected-passed-count"
                                    style="background-color: #89fc19; display: inline-table; width: 40px;"></span>
                                <span id="count_box_deleted" class="expected-passed-count"
                                    style="background-color: #cd5c5c; display: inline-table; width: 40px;"></span>
                                <span id="years" style="display: inline-table; width: 90px; margin-left: 12px;"></span>
                            </div>
                        </div>
                        <div id="courses_chart"></div>
                    </div>
                    <!-- OWNERS BLOCK -->
                    <div class="box" style="margin-top: 10px; min-height: 270px;">
                        <div id="owner_wait"
                            style="display: none; height: 32px; position: absolute; top: 650px; left: 590px; width: 40px;">
                            <div class="loader loader-view"></div>
                        </div>
                        <div class="float-left"
                            style="font-size: x-large; text-align: center; transform: rotate(-90deg); transform-origin: left top 0; position: absolute; top: 846px;">
                            Неделя: <span id="owner_week"
                                style="font-family: 'Programme-Pan'; padding-left: 5px;">--</span>
                        </div>
                        <div class="float-left" style="margin-left: 40px;">
                            <div style="font-size: x-large; margin-top: 60px;">Назначаемость (%)</div>
                            <div style="font-size: x-large; margin-top: 102px;">Проходимость (%)</div>
                        </div>
                        <div class="float-left">
                            <div id="courses_assign"></div>
                            <div id="courses_pass"></div>
                        </div>
                    </div>

                </div>
            </div>
            <div id="bottom_block" style="min-height: 300px; margin-top: 10px">

            </div>
        </div>

        <div id="right_box"></div>
    </div>

    <script type="text/html" id="owner_template">
    <div class="float-left flag-block">
        <div id="owner_caption" class="flag-caption"></div>
        <div id="owner_value" class="float-left owner-value number-field-shadow"></div>
        <div id="owner_bottom" class="owner-bottom"></div>
    </div>
</script>

    <script type="application/javascript">
        appendOwnerChild("courses_assign", "rck", "РЦК");
        appendOwnerChild("courses_assign", "ock", "ОЦК");
        appendOwnerChild("courses_assign", "fck", "ФЦК");
        appendOwnerChild("courses_assign", "roiv", "РОИВ");
        appendOwnerChild("courses_assign", "partner", "Партнер");
        appendOwnerChild("courses_assign", "commerce", "Коммерция");
        appendOwnerChild("courses_assign", "with_no_right", "Без прав");

        appendOwnerChild("courses_pass", "rck", "РЦК");
        appendOwnerChild("courses_pass", "ock", "ОЦК");
        appendOwnerChild("courses_pass", "fck", "ФЦК");
        appendOwnerChild("courses_pass", "roiv", "РОИВ");
        appendOwnerChild("courses_pass", "partner", "Партнер");
        appendOwnerChild("courses_pass", "commerce", "Коммерция");
        appendOwnerChild("courses_pass", "with_no_right", "Без прав");
    </script>

</body>

</html>
