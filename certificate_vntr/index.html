<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Кабинет ВТ</title>

    <link rel="icon" href="./fcc/images/trainer.ico"/>

    <link rel="stylesheet" href="./fcc/css/common.css"/>
    <style>
        body {
            font-family: 'Trebuchet MS', Verdana, Tahoma, sans-serif;
            background-color: #e4e4e4;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(1rem, 3%) 1fr minmax(5rem, 15%);
            grid-template-rows: auto;
        }

        h6 {
            font-size: 1rem;
        }

        hr {
            margin: 1rem 0;
            color: gray;
            border: 0;
            border-top: 1px solid;
            opacity: .25;
        }

        td {
            cursor: pointer;
        }

        tr:nth-child(odd) {
            background-color: #eaeaea;
        }

        tr:nth-child(even) {
            background-color: #cacaca;
        }

        .row:hover {
            background-color: #0086cd !important;
            color: mintcream;
        }

        .page-button {
            color: mintcream;
            cursor: pointer;
            padding-right: 1rem !important;
            padding-left: 1rem !important;
            border: 1px solid mintcream !important;
            height: 28px;
            background-image: linear-gradient(-20deg, #0086cd, #3fa4d9 0%, #0086cd 100%);
        }

        .first-page-button {
            border-top-left-radius: 0.375rem;
            border-bottom-left-radius: 0.375rem;
        }

        .last-page-button {
            border-top-right-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
        }

        .selected-button {
            background-image: linear-gradient(-20deg, #0086cd, #3fa4d9 0%, #0086cd 100%);
        }

        .unselected-button {
            background-image: linear-gradient(-20deg, grey, grey 0%, grey 100%);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background-color: white;
            box-shadow: 0 2px 6px 0 rgb(218 218 253 / 65%), 0 2px 6px 0 rgb(159, 89, 1);
            border-bottom: 1px solid var(--color-border) !important;
            z-index: 10000;
            user-select: none;
        }

        input {
            caret-color: #ff6f61;
        }

        .item:not(:last-child) {
            border-inline-end: solid 2px #888888;
        }

        .sort_image {
            width: 16px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>

    <script type="text/javascript" src="./scripts/jquery.js"></script>
    <script type="text/javascript" src="./fcc/js/webSocket.js"></script>
    <script type="text/javascript" src="./fcc/js/jsonReviver.js"></script>
    <script type="text/javascript" src="./fcc/js/common_classes.js"></script>
    <script type="text/javascript" src="./fcc/certificate_vntr/index.js"></script>
</head>
<body>

<div style="cursor: pointer; position: absolute; top: 20px; left: 20px;">
    <div id="home" class="float-left" onclick="IndexPage.goHome()">
        <img src="./fcc/images/home.png">
    </div >
    <div class="float-left">

    </div>
</div>

<div id="grid" class="grid">

</div>

<script type="text/html" id="report_template">
<div class="flat-card" style="width: 90%; margin-left: 19px; margin-top: 18%; height: 70px;">
    <div style="padding-top: 20px;">
        <button id="report_button" class="blink button-control enable-button" style="margin-left: 15%; margin-right: 5%;" onclick="IndexPage.startAgent()">
            <div class="text">Общая выгрузка</div>
        </button>
    </div>
    <div id="report_message" style="display: none; margin-left: 19%; margin-right: 5%;">Выгрузка завершена</div>
</div>
</script>

<script type="text/html" id="grid_row_template">
    <div id="left_box"></div>
    <div id="grid_box" style="padding-top: 20px;">

    </div>
    <div id="right_box"></div>
</script>

<script type="text/html" id="card_template">
    <div id="card" class="flat-card" style="width: 100%; height: 820px;">
        <h6 id="group" style="padding-top: 20px; padding-left: 40px;"></h6>
        <hr style="margin-top: -20px;">
        <div>
            <div class="float-right">
                <input id="card_find" type="search" class="input-control" placeholder="" aria-controls="example" style="margin-right: 10px;">
                <div class="float-left" style="margin-top: 2px; margin-right: 10px;" >Найти</div>
            </div>
        </div>
        <hr style="margin-top: 64px;">
        <div class="scrollbar-control" style="height: 75%;">
            <table id="card_table" border="0" style="width: 99%; padding-left: 20px; padding-right: 20px;"></table>
        </div>
        <div id="paging" style="margin-top: 16px;">
            <div id="page_message" class="float-left" style="margin-left: 20px;"></div>
            <div id="page_box" class="float-right" style="margin-right: 20px;">
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="header_row_template">
    <tr class="sticky header-colors">
        <td style="width: 20%; padding-top: 3px; padding-bottom: 3px; font-weight: bold;">
            <div class="float-left">ФИО</div>
            <!-- div class="float-right"><img id="sort_1" src="./fcc/js/images/sort_none.png" class="sort_image" data-sort="none" onclick="IndexPage.sortData(this, 0);"/></div-->
        </td>
        <td style="font-weight: bold;">
            <div class="float-left">Email</div>
        </td>
        <td style="text-align: center; width: 95px; font-weight: bold;">
            <div class="float-left">ИНН</div>
        </td>
        <td style="font-weight: bold;">
            <div class="float-left">Организация</div>
        </td>
        <td style="text-align: center; font-weight: bold;">
            <div class="float-left">Уволен</div>
        </td>
    </tr>
</script>

<script type="text/html" id="member_row_template">
    <tr id="row" class="row" onclick="IndexPage.goToUserCertificate(this)">
        <td id="fio" style="text-indent: 5px; padding-top: 3px; padding-bottom: 3px;"></td>
        <td id="email" ></td>
        <td id="inn" style="text-align: center"></td>
        <td id="name"></td>
        <td id="dismiss" style="text-align: center;"></td>
    </tr>
</script>

<script type="text/html" id="page_button_template">
    <button id="page_button" class="float-left page-button"></button>
</script>

<script>
    $(document).ready(function () {
        IndexPage.initialize();
    });
</script>

</body>
</html>
